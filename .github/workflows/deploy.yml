name: Deploy Database

# terraform apply toca a nuvem — apenas push em main.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: destroy
        type: choice
        options: [apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.8
  TF_ENVIRONMENT: producao
  TF_STATE_KEY: tech-challenge-infra-database/producao/terraform.tfstate

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check SSM prerequisites
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          for PARAM in vpc_id private_subnet_ids lambda_security_group_id rds_access_security_group_id eks_node_security_group_id; do
            aws ssm get-parameter --name "${PREFIX}/infra/${PARAM}"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"
        working-directory: terraform

      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ env.TF_ENVIRONMENT }}"
        working-directory: terraform

      - name: Smoke test — SSM database exports
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          aws ssm get-parameter --name "${PREFIX}/database/rds_endpoint"
          aws ssm get-parameter --name "${PREFIX}/database/db_secret_arn"

  update-lambda:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' || github.event.inputs.action == 'apply'
    environment: producao
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update auth Lambda with DB secret
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          LAMBDA=$(aws ssm get-parameter --name "${PREFIX}/infra/lambda_auth_function_name" --query Parameter.Value --output text)
          DB_ARN=$(aws ssm get-parameter --name "${PREFIX}/database/db_secret_arn" --query Parameter.Value --output text)
          aws lambda update-function-configuration \
            --function-name "$LAMBDA" \
            --environment "Variables={DB_SECRET_ARN=${DB_ARN},JWT_SECRET=${{ secrets.JWT_SECRET }},NODE_ENV=${{ env.TF_ENVIRONMENT }}"
          aws lambda wait function-updated --function-name "$LAMBDA"

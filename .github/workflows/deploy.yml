name: Deploy Database

# terraform apply toca a nuvem — apenas push em main (terraform/**).
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Digite DESTRUIR-tech-challenge-infra-database para confirmar destroy
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.8
  TF_ENVIRONMENT: producao
  TF_STATE_KEY: tech-challenge-infra-database/producao/terraform.tfstate

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validar confirmação de destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTRUIR-tech-challenge-infra-database" ]; then
            echo "Confirmação de destroy inválida ou ausente."
            echo "Digite exatamente: DESTRUIR-tech-challenge-infra-database"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check SSM prerequisites
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          for PARAM in vpc_id private_subnet_ids lambda_security_group_id rds_access_security_group_id eks_node_security_group_id; do
            aws ssm get-parameter --name "${PREFIX}/infra/${PARAM}"
          done

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"
        working-directory: terraform

      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply' || github.event.inputs.action == 'plan'
        run: |
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ env.TF_ENVIRONMENT }}"
        working-directory: terraform

      - name: Smoke test — SSM database exports
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          aws ssm get-parameter --name "${PREFIX}/database/rds_endpoint"
          aws ssm get-parameter --name "${PREFIX}/database/db_secret_arn"
          aws ssm get-parameter --name "${PREFIX}/database/billing_db_secret_arn"